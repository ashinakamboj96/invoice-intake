spring:
  application:
    name: trusted-invoice-intake
  datasource:
    url: jdbc:postgresql://localhost:5432/invoice_intake
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

llm:
  api-key: ${LLM_API_KEY}
  model: claude-sonnet-4-6
  timeout-seconds: 30

validation:
  ocr-confidence-threshold: 0.90
  min-text-length: 50

async:
  core-pool-size: 2
  max-pool-size: 5
  queue-capacity: 10

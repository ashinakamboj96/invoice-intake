<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Invoices</title>
</head>
<body>
<div layout:fragment="content">

    <div id="upload-alerts" class="mb-3"></div>

    <div id="dropzone" class="upload-dropzone p-5 text-center mb-4">
        <i class="bi bi-cloud-arrow-up display-4 text-secondary"></i>
        <p class="mt-2 mb-1 fs-5">Drag and drop an invoice here</p>
        <p class="text-muted small mb-3">PDF, JPG, PNG or TIFF — up to 10MB</p>
        <button type="button" id="upload-btn" class="btn btn-primary">
            <i class="bi bi-upload me-1"></i>Upload Invoice
        </button>
        <input type="file" id="file-input" class="d-none" accept=".pdf,.jpg,.jpeg,.png,.tiff">
    </div>

    <form th:action="@{/}" method="get" class="card card-body bg-light mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-2">
                <label class="form-label small text-muted mb-1" for="status">Status</label>
                <select id="status" name="status" class="form-select form-select-sm">
                    <option value="">All statuses</option>
                    <option th:each="s : ${statuses}"
                            th:value="${s}"
                            th:text="${s}"
                            th:selected="${s == currentStatus}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted mb-1" for="vendor">Vendor</label>
                <input type="text" id="vendor" name="vendor" class="form-control form-control-sm"
                       placeholder="Vendor name" th:value="${currentVendor}">
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted mb-1" for="invoiceNumber">Invoice No</label>
                <input type="text" id="invoiceNumber" name="invoiceNumber" class="form-control form-control-sm"
                       placeholder="Invoice number" th:value="${currentInvoiceNumber}">
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted mb-1" for="currency">Currency</label>
                <select id="currency" name="currency" class="form-select form-select-sm">
                    <option value="">All currencies</option>
                    <option th:each="c : ${currencies}"
                            th:value="${c}"
                            th:text="${c}"
                            th:selected="${c == currentCurrency}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted mb-1" for="dateFrom">Date from</label>
                <input type="date" id="dateFrom" name="dateFrom" class="form-control form-control-sm"
                       th:value="${currentDateFrom}">
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted mb-1" for="dateTo">Date to</label>
                <input type="date" id="dateTo" name="dateTo" class="form-control form-control-sm"
                       th:value="${currentDateTo}">
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted mb-1" for="amountMin">Min amount</label>
                <input type="number" step="0.01" id="amountMin" name="amountMin" class="form-control form-control-sm"
                       th:value="${currentAmountMin}">
            </div>
            <div class="col-md-2">
                <label class="form-label small text-muted mb-1" for="amountMax">Max amount</label>
                <input type="number" step="0.01" id="amountMax" name="amountMax" class="form-control form-control-sm"
                       th:value="${currentAmountMax}">
            </div>
            <div class="col-md-3 d-flex gap-2">
                <button type="submit" class="btn btn-sm btn-primary flex-fill">
                    <i class="bi bi-search me-1"></i>Search
                </button>
                <a th:href="@{/}" class="btn btn-sm btn-outline-secondary flex-fill">Clear</a>
            </div>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(invoices)}" class="text-center text-muted py-5">
        <i class="bi bi-inbox display-4 d-block mb-3"></i>
        <p class="fs-5 mb-0">No invoices yet. Upload your first invoice above.</p>
    </div>

    <div th:unless="${#lists.isEmpty(invoices)}" class="table-responsive">
        <table class="table align-middle">
            <thead>
            <tr>
                <th>Vendor</th>
                <th>Invoice No</th>
                <th>Date</th>
                <th>Total</th>
                <th>Currency</th>
                <th>Status</th>
                <th>Issues</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="invoice : ${invoices}"
                th:classappend="${invoice.status.name() == 'NEEDS_REVIEW'} ? 'table-warning'">
                <td th:text="${invoice.vendorName ?: '—'}">Acme Supplies Inc.</td>
                <td th:text="${invoice.invoiceNumber ?: '—'}">INV-123</td>
                <td th:text="${invoice.invoiceDate ?: '—'}">2026-03-14</td>
                <td th:text="${invoice.totalAmount != null ? #numbers.formatDecimal(invoice.totalAmount, 1, 'COMMA', 2, 'POINT') : '—'}">297.00</td>
                <td th:text="${invoice.currency ?: '—'}">USD</td>
                <td>
                    <span class="badge" th:classappend="'status-badge-' + ${invoice.status}"
                          th:text="${invoice.status}">ACCEPTED</span>
                </td>
                <td>
                    <span th:if="${invoice.unresolvedFailureCount > 0}"
                          class="badge bg-warning text-dark"
                          th:text="${invoice.unresolvedFailureCount}">2</span>
                    <span th:unless="${invoice.unresolvedFailureCount > 0}" class="text-muted">—</span>
                </td>
                <td>
                    <a th:href="@{/invoices/{id}(id=${invoice.id})}" class="btn btn-sm btn-outline-primary">View</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <nav th:if="${totalPages > 1}" aria-label="Invoice pagination" class="d-flex justify-content-between align-items-center mt-3">
        <a class="btn btn-sm btn-outline-secondary"
           th:classappend="${currentPage <= 0} ? 'disabled'"
           th:href="@{/(page=${currentPage - 1}, size=${pageSize}, status=${currentStatus}, vendor=${currentVendor}, invoiceNumber=${currentInvoiceNumber}, currency=${currentCurrency}, dateFrom=${currentDateFrom}, dateTo=${currentDateTo}, amountMin=${currentAmountMin}, amountMax=${currentAmountMax})}">
            <i class="bi bi-chevron-left me-1"></i>Previous
        </a>
        <span class="text-muted small" th:text="'Page ' + (${currentPage} + 1) + ' of ' + ${totalPages} + ' (' + ${totalElements} + ' total)'">Page 1 of 1</span>
        <a class="btn btn-sm btn-outline-secondary"
           th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'"
           th:href="@{/(page=${currentPage + 1}, size=${pageSize}, status=${currentStatus}, vendor=${currentVendor}, invoiceNumber=${currentInvoiceNumber}, currency=${currentCurrency}, dateFrom=${currentDateFrom}, dateTo=${currentDateTo}, amountMin=${currentAmountMin}, amountMax=${currentAmountMax})}">
            Next<i class="bi bi-chevron-right ms-1"></i>
        </a>
    </nav>

</div>
</body>
</html>
